# Configuração usada pelos testes automatizados (perfil "test"): banco H2 em memória,
# sem depender de um Postgres rodando, e limites de rate limiting relaxados para não
# gerar falsos negativos quando vários testes de auth rodam em sequência.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LXVzZWQtb25seS1lbS10ZXN0ZXMtYXV0b21hdGl6YWRvcw==
  expiration-ms: 900000
  refresh-expiration-ms: 604800000

app:
  cookie-secure: false
  rate-limit:
    janela-ms: 60000
    max-tentativas: 1000

tmdb:
  api-key: ""
