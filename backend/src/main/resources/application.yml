server:
  port: 8080

spring:
  application:
    name: biblioteca-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD:biblioteca}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  # O valor abaixo é usado apenas se JWT_SECRET não estiver definida (ex: `mvn spring-boot:run`
  # local). Gere uma chave própria com: openssl rand -base64 64
  # NUNCA use este valor padrão em produção — defina sempre JWT_SECRET no ambiente.
  secret: ${JWT_SECRET:d29ybGRzLW1vc3Qtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1wbGVhc2U=}
  # Access token: vida curta (15 min por padrão), pois é enviado a cada requisição.
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  # Refresh token: vida longa (7 dias por padrão). Usado só para renovar o access token.
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  cors:
    # Domínios do frontend liberados no CORS. Separe por vírgula se tiver mais de um.
    # Ex: https://meuapp.vercel.app,https://meuapp.netlify.app
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # Marca os cookies de autenticação como Secure (só enviados via HTTPS).
  # Defina APP_COOKIE_SECURE=true em produção (atrás de HTTPS).
  cookie-secure: ${APP_COOKIE_SECURE:false}
  # Janela e limite do rate limiting em /api/auth/login e /api/auth/register.
  rate-limit:
    janela-ms: ${APP_RATE_LIMIT_WINDOW_MS:60000}
    max-tentativas: ${APP_RATE_LIMIT_MAX_ATTEMPTS:10}

tmdb:
  api-key: ${TMDB_API_KEY:}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p/w500

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.meuprojeto: INFO
